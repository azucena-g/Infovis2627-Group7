<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 4</title>
  <link rel="stylesheet" href="assets/student.css">
  <style>
    .charts-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
    }
    .chart-frame {
      flex: 1 1 380px;
      width: 100%;
      height: 270px;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="task-canvas" id="main-content">
    <h1 class="visually-hidden" id="page-title">Task 4 visualisation</h1>
    <div id="visualisation" role="region" aria-labelledby="page-title">
      <div class="charts-grid">
        <iframe
          src="assets/task4_pop_is_best.png"
          title="Rising genres"
          class="chart-frame"
          loading="lazy"
        ></iframe>
        <iframe
          src="assets/task4_top_artists.png"
          title="Top rising artists"
          class="chart-frame"
          loading="lazy"
        ></iframe>
      </div>
    </div>
      
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 4</title>
  <link rel="stylesheet" href="assets/student.css">
  <style>
    .charts-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      width: 800px;
      height: 450px;
      padding: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .chart-frame {
      width: 382px;
      height: 410px;
      border: 0;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main class="task-canvas" id="main-content">
    <h1 class="visually-hidden" id="page-title">Task 4 visualisation</h1>
    <div id="visualisation" role="region" aria-labelledby="page-title">
      <div class="charts-grid">
        <iframe
          src="assets/task4_chart_1.html"
          title="Rising genres"
          class="chart-frame"
          loading="lazy"
        ></iframe>
        <iframe
          src="assets/task4_chart_2.html"
          title="Top rising artists"
          class="chart-frame"
          loading="lazy"
        ></iframe>
      </div>
    </div>
      
  </main>
</body>
</html>
